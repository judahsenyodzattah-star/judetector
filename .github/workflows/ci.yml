name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app api tests

      - name: Tests
        run: pytest -q

  container:
    name: api image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t judetector-api:ci .

      - name: Health check without weights
        run: |
          docker run -d --name api -p 8080:8080 judetector-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/v1/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          docker rm -f api

  web:
    name: web app builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The same command Vercel runs. It also proves no page needs a live API
      # at build time: an unreachable service renders the unavailable state.
      - name: Build
        run: npm run build
